services:
    -   type: web
        name: notes-sharing-site
        runtime: python
        buildCommand: "./build.sh"
        startCommand: "gunicorn NotesSharingSite.wsgi"
        envVars:
            -   key: DATABASE_URL
                fromDatabase:
                    name: main-db
                    property: connectionString
            -   key: SECRET_KEY
                generateValue: true
            -   key: DEBUG
                value: "False"

databases:
    -   name: main-db
        plan: free